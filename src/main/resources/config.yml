# You can define the number of kits that a player can save here. By default, players will have permissions for all the kits,
# but you can use a Permission Manager, such as LuckPerms, to set, for example, 'kitsx.kit7' to false for a player or a LuckPerms group,
# and, They won't be able to load/use the Kit 7

kits: 7
auto_rekit: false

hooks:
  skript: true

cooldowns:
  # Accepts values like "5s", "2m", "1h30m", "1d2h15m". Set to "0" to disable.
  kit_load: "5s"

broadcast:
  kit_load: true
  kit_load_message:
    - '&f&#FFD700%player%&f &#7DFFA8loaded&f &#FFD700%kit%&f.'
  kit_load_message_delay: 20 # In ticks (20 ticks = 1 second)
  kitroom_open: true
  kitroom_open_message: '&f&#FFD700%player%&f opened the Virtual Kit Room.'
  kitroom_open_message_delay: 20 # In ticks (20 ticks = 1 second)
  premadekit_load: true
  premadekit_load_message: '&f&#FFD700%player%&f &#7DFFA8loaded&f the premade kit.'
  premadekit_load_message_delay: 20 # In ticks (20 ticks = 1 second)

messages:
  no_permission: '&fYou do &#FF0048not&f have permission to use this command.'
  blacklisted_region: '&fYou &#FF0048cannot&f use this command here.'
  kit_saved: '&f&#FFD700%kit%&f &#7DFFA8saved&f successfully!'
  kit_loaded: '&f&#FFD700%kit%&f &#7DFFA8loaded&f successfully!'
  kit_load_cooldown: '&fPlease wait &#FFD700%time%&f before loading another kit.'
  editor_region_required: '&fYou can only edit kits in the kit editor region.'
  kit_edit_started: '&fEditing &#FFD700%kit%&f.'
  kit_edit_save_hint: '&fUse &#FFD700/customkit&f for items, &#FFD700/%kitcmd% save&f to save, or &#FFD700/kitcancel&f to cancel.'
  kit_edit_wrong_kit: '&fYou are editing &#FFD700%kit%&f. Use &#FFD700/%kitcmd% save&f for that kit.'
  premade_kit_saved: '&fPremade kit &#7DFFA8saved&f successfully!'
  premade_kit_loaded: '&fPremade kit &#7DFFA8loaded&f successfully!'
  premade_kit_empty: '&fThe premade kit is &#FF0048empty&f.'
  auto_rekit_kit_selected: '&fAuto Rekit kit set to &#FFD700%kit%&f.'
  send_auto_rekit_message: true
  auto_rekit_message: '&fAutomatically rekitted for you. Use &#FFD700/autorekit&f to toggle or edit the kit.'

blacklisted_regions:
  - "arena1"
  - "arena2"

editor_regions:
  - "kit_editor"
